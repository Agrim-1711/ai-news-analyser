<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NewsAnalyser</title>

    <link rel="stylesheet" href="/static/styles.css">
</head>

<body>
    <header>
        <div class="container">
            <h1>NewsAnalyser</h1>
            <p>Search recent news and analyse it with AI.</p>
        </div>
    </header>

    <main class="container">

        <section>
            <h2>Research a question</h2>
            <p>Explore news with cited findings based on article titles and descriptions.</p>
            <form id="research-form">
                <label for="research-input">Your question</label>
                <input id="research-input" type="text" minlength="3" maxlength="1000"
                    placeholder="What are the recent developments affecting Nvidia?" required>
                <button type="submit">Research</button>
            </form>
            <p id="research-status" class="status" role="status" aria-live="polite"></p>
            <div id="research-result"></div>
        </section>

        <section>
            <h2>Search news</h2>

            <form id="search-form">
                <input
                    id="search-input"
                    type="search"
                    placeholder="Search for a topic..."
                    required
                >
                <button type="submit">Search</button>
            </form>

            <p id="search-status" class="status"></p>

            <div id="search-results" class="grid"></div>
        </section>

        <section>
            <h2>Previous analyses</h2>

            <div id="analysis-history" class="grid"></div>
        </section>

    </main>

    <script src="/static/app.js"></script>
</body>
</html>
